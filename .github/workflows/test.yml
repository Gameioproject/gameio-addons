name: Test
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: |
          python tools/gameio_addon.py build --config examples/starter/addon.json --sources examples/starter/sources.csv --output /tmp/starter
          python tools/gameio_addon.py validate /tmp/starter/manifest.json
